<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سمكمك | Luxury Seafood</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="navbar">
  <div class="brand">سمكمك</div>
  <div class="links">
    <a href="#fish">الأسماك</a>
    <a href="#sides">الأطباق الجانبية</a>
    <a href="#salads">السلطات</a>
    <a href="#drinks">المشروبات</a>
  </div>
</nav>

<header class="hero">
<div class="overlay"></div>
<!-- ضع الخلفية هنا: images/background-head.jpg -->
<div class="heroBox">
<!-- ضع اللوجو هنا: images/logo.png -->
<img src="images/logo.png" class="logo">
<h1>مطعم سمكمك</h1>
<p>Fresh Taste • Premium Quality</p>
<a class="heroBtn" href="#menu">استعرض المنيو</a>
</div>
</header>

<section id="menu">
<div class="filters">
<button onclick="filterCards('all')">الكل</button>
<button onclick="filterCards('fish')">الأسماك</button>
<button onclick="filterCards('sides')">الجانبية</button>
<button onclick="filterCards('salads')">السلطات</button>
<button onclick="filterCards('drinks')">المشروبات</button>
</div>

<div class="grid">
<!-- كرر البطاقات بنفس النمط -->
<div class="card fish reveal">
<img src="images/fish/fish1.jpg" onclick="openLightbox(this.src)">
<h3>اسم السمكة</h3>
<span>السعر</span>
</div>

<div class="card sides reveal">
<img src="images/sides/side1.jpg" onclick="openLightbox(this.src)">
<h3>اسم الصنف</h3>
<span>السعر</span>
</div>

<div class="card salads reveal">
<img src="images/salads/salad1.jpg" onclick="openLightbox(this.src)">
<h3>اسم الصنف</h3>
<span>السعر</span>
</div>

<div class="card drinks reveal">
<img src="images/drinks/drink1.jpg" onclick="openLightbox(this.src)">
<h3>اسم المشروب</h3>
<span>السعر</span>
</div>
</div>
</section>

<section class="actions">
<button>📞 تواصل معنا</button>
<button>📍 الفروع</button>
</section>

<a class="whatsapp" href="https://wa.me/201032122268">💬</a>

<footer>تم الإنشاء منذ عام 1982</footer>

<div id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script src="script.js"></script>
</body>
</html>
